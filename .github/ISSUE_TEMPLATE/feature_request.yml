name: 💡 Suggest an idea / Proposer une idée
description: A new feature or an improvement for Pixane. / Une nouvelle fonction ou une amélioration de Pixane.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! You can also talk about it first in **Discussions → Ideas**, and check the [roadmap](https://github.com/georgeschris01/pixane/issues/1) to see what is already planned.
        Merci pour votre idée ! Vous pouvez aussi en parler d'abord dans **Discussions → Ideas**, et regarder la [feuille de route](https://github.com/georgeschris01/pixane/issues/1) pour voir ce qui est déjà prévu.
  - type: textarea
    id: what
    attributes:
      label: What would you like to do, and why? / Que voudriez-vous faire, et pourquoi ?
      description: The problem you meet, or what is missing for you. / Le problème rencontré, ou ce qui vous manque.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How do you imagine it? / Comment l'imaginez-vous ?
      description: Optional. A tool, a menu, a button… whatever you have in mind. / Facultatif. Un outil, un menu, un bouton… ce que vous avez en tête.
    validations:
      required: false
